<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="InsurOS Ledger Seal">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Onest:wght@600&amp;display=swap');
    .display { font-family: Fraunces, Georgia, 'Times New Roman', serif; }
    .label { font-family: Onest, 'Segoe UI', Arial, sans-serif; }
  </style>
  <defs>
    <radialGradient id="sealGrad" cx="35%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#1cb389"/>
      <stop offset="55%" stop-color="#0f6e56"/>
      <stop offset="100%" stop-color="#0a4f3e"/>
    </radialGradient>
    <clipPath id="sealClip"><circle cx="120" cy="120" r="88"/></clipPath>
    <path id="topArc" d="M 42 120 A 78 78 0 0 1 198 120" fill="none"/>
  </defs>

  <!-- Wax-seal body -->
  <circle cx="120" cy="120" r="112" fill="url(#sealGrad)"/>
  <circle cx="120" cy="120" r="112" fill="none" stroke="#083d30" stroke-width="2"/>

  <!-- Coin-edge ticks -->
  <circle cx="120" cy="120" r="104" fill="none" stroke="#f6f3ec" stroke-opacity="0.5"
          stroke-width="6" stroke-dasharray="1.6 5.13"/>

  <!-- Double inner rule -->
  <circle cx="120" cy="120" r="94" fill="none" stroke="#f6f3ec" stroke-opacity="0.9" stroke-width="1.6"/>
  <circle cx="120" cy="120" r="90" fill="none" stroke="#f6f3ec" stroke-opacity="0.45" stroke-width="0.8"/>

  <!-- Ruled ledger lines, clipped to the seal face -->
  <g clip-path="url(#sealClip)" stroke="#f6f3ec" stroke-opacity="0.16" stroke-width="1">
    <line x1="20" y1="152" x2="220" y2="152"/>
    <line x1="20" y1="168" x2="220" y2="168"/>
    <line x1="20" y1="184" x2="220" y2="184"/>
    <line x1="20" y1="200" x2="220" y2="200"/>
  </g>

  <!-- Arc inscription -->
  <text class="label" font-size="12.5" font-weight="600" letter-spacing="4.4"
        fill="#f6f3ec" fill-opacity="0.92">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">THE UNDERWRITER&#8217;S LEDGER</textPath>
  </text>

  <!-- Monogram -->
  <text class="display" x="120" y="148" font-size="76" font-weight="600"
        text-anchor="middle" fill="#f6f3ec">In</text>

  <!-- Gold signature rule -->
  <line x1="86" y1="163" x2="154" y2="163" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>

  <!-- Foundation year -->
  <text class="label" x="120" y="196" font-size="11" font-weight="600" letter-spacing="3"
        text-anchor="middle" fill="#f6f3ec" fill-opacity="0.75">MMXXVI</text>
</svg>

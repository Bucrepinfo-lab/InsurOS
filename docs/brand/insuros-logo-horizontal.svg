<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="InsurOS logo">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Onest:wght@600&amp;display=swap');
    .display { font-family: Fraunces, Georgia, 'Times New Roman', serif; }
    .label { font-family: Onest, 'Segoe UI', Arial, sans-serif; }
  </style>
  <defs>
    <radialGradient id="sealGradH" cx="35%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#1cb389"/>
      <stop offset="55%" stop-color="#0f6e56"/>
      <stop offset="100%" stop-color="#0a4f3e"/>
    </radialGradient>
    <clipPath id="sealClipH"><circle cx="110" cy="110" r="66"/></clipPath>
  </defs>

  <!-- Seal mark -->
  <g>
    <circle cx="110" cy="110" r="84" fill="url(#sealGradH)"/>
    <circle cx="110" cy="110" r="84" fill="none" stroke="#083d30" stroke-width="1.6"/>
    <circle cx="110" cy="110" r="78" fill="none" stroke="#f6f3ec" stroke-opacity="0.5"
            stroke-width="4.5" stroke-dasharray="1.3 3.75"/>
    <circle cx="110" cy="110" r="70" fill="none" stroke="#f6f3ec" stroke-opacity="0.9" stroke-width="1.3"/>
    <g clip-path="url(#sealClipH)" stroke="#f6f3ec" stroke-opacity="0.16" stroke-width="1">
      <line x1="30" y1="134" x2="190" y2="134"/>
      <line x1="30" y1="147" x2="190" y2="147"/>
      <line x1="30" y1="160" x2="190" y2="160"/>
    </g>
    <text class="display" x="110" y="132" font-size="60" font-weight="600"
          text-anchor="middle" fill="#f6f3ec">In</text>
    <line x1="84" y1="144" x2="136" y2="144" stroke="#c9a227" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text class="display" x="228" y="124" font-size="84" font-weight="600" fill="#1b2a41">Insur<tspan fill="#0f6e56">OS</tspan></text>
  <line x1="232" y1="146" x2="716" y2="146" stroke="#c9a227" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
  <text class="label" x="232" y="174" font-size="15.5" font-weight="600" letter-spacing="4.6" fill="#5b6474">THE UNDERWRITER&#8217;S LEDGER</text>
</svg>

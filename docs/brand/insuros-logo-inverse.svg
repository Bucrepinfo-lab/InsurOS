<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="InsurOS logo, inverse">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Onest:wght@600&amp;display=swap');
    .display { font-family: Fraunces, Georgia, 'Times New Roman', serif; }
    .label { font-family: Onest, 'Segoe UI', Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="inkGround" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22334e"/>
      <stop offset="60%" stop-color="#1b2a41"/>
      <stop offset="100%" stop-color="#131f31"/>
    </linearGradient>
    <radialGradient id="sealGradI" cx="35%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#22c496"/>
      <stop offset="55%" stop-color="#17a37e"/>
      <stop offset="100%" stop-color="#0f6e56"/>
    </radialGradient>
    <clipPath id="sealClipI"><circle cx="110" cy="110" r="66"/></clipPath>
  </defs>

  <rect width="760" height="220" rx="20" fill="url(#inkGround)"/>

  <g>
    <circle cx="110" cy="110" r="84" fill="url(#sealGradI)"/>
    <circle cx="110" cy="110" r="84" fill="none" stroke="#0a4f3e" stroke-width="1.6"/>
    <circle cx="110" cy="110" r="78" fill="none" stroke="#f6f3ec" stroke-opacity="0.55"
            stroke-width="4.5" stroke-dasharray="1.3 3.75"/>
    <circle cx="110" cy="110" r="70" fill="none" stroke="#f6f3ec" stroke-opacity="0.9" stroke-width="1.3"/>
    <g clip-path="url(#sealClipI)" stroke="#f6f3ec" stroke-opacity="0.18" stroke-width="1">
      <line x1="30" y1="134" x2="190" y2="134"/>
      <line x1="30" y1="147" x2="190" y2="147"/>
      <line x1="30" y1="160" x2="190" y2="160"/>
    </g>
    <text class="display" x="110" y="132" font-size="60" font-weight="600"
          text-anchor="middle" fill="#f6f3ec">In</text>
    <line x1="84" y1="144" x2="136" y2="144" stroke="#c9a227" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <text class="display" x="228" y="124" font-size="84" font-weight="600" fill="#f6f3ec">Insur<tspan fill="#17a37e">OS</tspan></text>
  <line x1="232" y1="146" x2="716" y2="146" stroke="#c9a227" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
  <text class="label" x="232" y="174" font-size="15.5" font-weight="600" letter-spacing="4.6" fill="#f6f3ec" fill-opacity="0.6">THE UNDERWRITER&#8217;S LEDGER</text>
</svg>

# Fly.io — InsurOS admin (Next.js 16, standalone, pnpm monorepo)
# Deploy from the repo root:  fly deploy --remote-only
# Runtime secrets (set once): fly secrets set SUPABASE_SEND_SMS_HOOK_SECRET=... \
#   AT_USERNAME=... AT_API_KEY=... AT_PAYMENTS_PRODUCT_NAME=... AT_PAYMENTS_CALLBACK_SECRET=... --app insuros
app = "insuros"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

# NEXT_PUBLIC_* are needed at BUILD time (baked into the client bundle).
# The Supabase URL + anon key are public by design. Replace the placeholders with
# your project values before deploying (leave blank to run in open dev mode).
[build.args]
NEXT_PUBLIC_SUPABASE_URL = "https://REPLACE-project-ref.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "REPLACE_WITH_SUPABASE_ANON_KEY"

[env]
PORT = "8080"
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "20s"
method = "GET"
path = "/api/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

# Fly.io — InsurOS admin (Next.js 16, standalone, pnpm monorepo)
# Deploy from the repo root:  fly deploy --remote-only
#
# Build args (public by design, NOT secrets) — pass on every deploy:
#   fly deploy --remote-only \
#     --build-arg NEXT_PUBLIC_SUPABASE_URL=<project url> \
#     --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=<anon key>
# The GitHub deploy workflow passes them from repository secrets of the same names.
# Without them the server fails closed (/api/health = 503, no dashboard).
#
# Runtime secrets (names only — set with `fly secrets set NAME=... --app insuros`):
#   AUTH_SECRET                    ≥32 random chars; signs sessions, peppers PIN hashes (REQUIRED)
#   DATABASE_URL                   PostgreSQL connection string (REQUIRED; fails closed without)
#   PLATFORM_OWNER_PHONES          comma-separated E.164 phones bootstrapped as platform owner
#   SUPABASE_SERVICE_ROLE_KEY      server-only; deletes a user's auth account on request
#   PLAY_REVIEW_PHONE, PLAY_REVIEW_CODE  Play reviewer demo access (both or neither)
#   SUPABASE_SEND_SMS_HOOK_SECRET  Supabase Auth -> Hooks -> Send SMS shared secret
#   AT_USERNAME, AT_API_KEY, AT_SENDER_ID   Africa's Talking (SMS OTP)
app = "insuros"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "20s"
method = "GET"
path = "/api/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

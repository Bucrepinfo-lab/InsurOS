<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2a41">
<title>Offline · InsurOS</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ec;color:#1b2a41;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
  main{max-width:360px;text-align:center}
  img{width:72px;height:72px}
  h1{font-size:1.25rem;margin:16px 0 8px}
  p{color:#5b6b7f;line-height:1.5}
  button{margin-top:16px;border:0;border-radius:12px;background:#1b2a41;color:#fff;padding:12px 20px;font-size:1rem}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="InsurOS">
  <h1>You're offline</h1>
  <p>InsurOS needs a connection to load your work. Nothing is stored on this device. Check your data or Wi-Fi and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>

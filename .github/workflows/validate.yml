name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck all packages and build admin app
        run: pnpm validate

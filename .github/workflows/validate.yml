name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Throwaway database for the DB-backed persistence contract tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insuros
          POSTGRES_PASSWORD: insuros
          POSTGRES_DB: insuros_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insuros -d insuros_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (same as the Dockerfile).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Frozen, exactly like the Docker build. If package.json changed, the
      # "Lockfile sync" workflow refreshes pnpm-lock.yaml on the branch.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Unit and contract tests (memory + Postgres)
        env:
          DATABASE_URL: postgres://insuros:insuros@localhost:5432/insuros_test
        run: pnpm test --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Report test counts
        if: always()
        run: |
          node -e '
            const r = require("./vitest-report.json");
            const msg = `tests passed=${r.numPassedTests} failed=${r.numFailedTests} skipped=${r.numPendingTests + r.numTodoTests} total=${r.numTotalTests}`;
            console.log(`::notice title=Vitest::${msg}`);
          ' || true

      - name: Lint (admin)
        run: pnpm lint

      - name: Build admin app
        run: pnpm -r build

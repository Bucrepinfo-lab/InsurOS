name: Lockfile sync

# Keeps pnpm-lock.yaml in step with package.json on feature branches, so CI and
# the Docker build can both install with --frozen-lockfile. Runs only when a
# manifest changes on a non-main branch; commits the refreshed lockfile back to
# that branch (a GITHUB_TOKEN push does not re-trigger workflows — push any
# follow-up commit to re-run Validate). Never runs on main.
on:
  push:
    branches-ignore: [main]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"

permissions:
  contents: write

concurrency:
  group: lockfile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile when out of date
        run: |
          if pnpm install --lockfile-only --frozen-lockfile --ignore-scripts; then
            echo "Lockfile already in sync."
            exit 0
          fi
          pnpm install --lockfile-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml with package.json"
          git push
